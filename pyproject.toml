[project]
name = "ecommerce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "channels>=4.3.2",
    "cryptography>=50.0.1",
    "django>=6.0.7",
    "django-choices-field>=4.0.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-treebeard>=5.3.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.13.0",
    "strawberry-graphql-django>=0.86.4",
    "uvicorn[standard]>=0.51.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
    "django-erd-generator>=0.1.7",
    "ipython>=9.15.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.ruff.lint]
ignore = [
    "I001",  # Unsorted imports
    "UP037", # Remove quotes from type annotations
    "UP045", # Convert Optional[T] to T | None
]
