<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GraphQL Voyager</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/graphql-voyager/dist/voyager.css">

    <script src="https://cdn.jsdelivr.net/npm/react@17/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/graphql-voyager@1.0.0/dist/voyager.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            font-family: sans-serif;
            background: #fafafa;
        }

        header {
            height: 60px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #4051b5;
            color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
        }

        .back {
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, .4);
            transition: .2s;
        }

        .back:hover {
            background: rgba(255, 255, 255, .15);
        }

        #voyager {
            height: calc(100vh - 60px);
        }
    </style>
</head>

<body>

    <header>
        <h1>GraphQL Schema</h1>

        <a class="back" href="index.md" onclick="history.back();return false;">
            ← Back
        </a>
    </header>

    <div id="voyager"></div>

    <script>
        fetch("schema.json")
            .then(r => r.json())
            .then(schema => {
                GraphQLVoyager.init(
                    document.getElementById("voyager"),
                    {
                        introspection: schema
                    }
                );
            });
    </script>

</body>

</html>
